[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "et-rho-acvo-news-selection"
version = "0.1.0"
description = "ET-RHO and ACVO reference implementation for news-title pseudo-label agreement experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gensim>=4.3.2,<5",
  "numpy>=1.24,<3",
  "optuna>=3.6,<6",
  "pandas>=2.0,<4",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.10,<2",
  "pythainlp>=5.0,<6",
]

[project.scripts]
et-rho-acvo = "et_rho_acvo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
